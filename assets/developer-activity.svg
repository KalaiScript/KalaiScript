<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <style>
    @keyframes key-blink {
      0%, 100% { fill: #24283b; }
      50% { fill: #7aa2f7; filter: drop-shadow(0 0 3px #7aa2f7); }
    }
    @keyframes code-scroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50px); }
    }
    @keyframes server-blink {
      0%, 100% { fill: #f7768e; opacity: 0.4; }
      50% { fill: #9ece6a; opacity: 1; filter: drop-shadow(0 0 2px #9ece6a); }
    }
    @keyframes lamp-flicker {
      0%, 100% { opacity: 0.04; }
      95% { opacity: 0.04; }
      96% { opacity: 0.07; }
      97% { opacity: 0.03; }
      98% { opacity: 0.05; }
    }
    @keyframes steam {
      0% { transform: translateY(0) scaleX(1); opacity: 0.1; }
      50% { transform: translateY(-5px) scaleX(1.3); opacity: 0.6; }
      100% { transform: translateY(-10px) scaleX(0.8); opacity: 0; }
    }
    @keyframes chart-pulse {
      0%, 100% { stroke-dashoffset: 0; }
      50% { stroke-dashoffset: 10; }
    }

    .key-caps rect {
      animation: key-blink 1.8s infinite;
    }
    .server-led {
      animation: server-blink 1.2s infinite;
    }
    .lamp-glow {
      animation: lamp-flicker 8s infinite;
    }
    .steam-line {
      animation: steam 2.5s ease-in-out infinite;
      stroke: #a9b1d6;
      stroke-linecap: round;
      fill: none;
    }
    .code-lines path {
      animation: code-scroll 6s linear infinite;
    }
    .chart-line {
      stroke-dasharray: 200;
      animation: chart-pulse 8s linear infinite;
    }
  </style>

  <defs>
    <!-- Screen Radial Glow -->
    <radialGradient id="screen-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(34, 211, 238, 0.15)" />
      <stop offset="100%" stop-color="rgba(26, 27, 38, 0)" />
    </radialGradient>
    
    <!-- Lamp Cone Gradient -->
    <linearGradient id="lamp-cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255, 158, 100, 0.15)" />
      <stop offset="100%" stop-color="rgba(26, 27, 38, 0)" />
    </linearGradient>
  </defs>

  <!-- Wall Background -->
  <rect width="100%" height="100%" fill="#1a1b26" rx="8" />

  <!-- Window Frame with City Stars -->
  <rect x="30" y="20" width="100" height="140" rx="4" fill="#16161e" stroke="#24283b" stroke-width="2" />
  <line x1="80" y1="20" x2="80" y2="160" stroke="#24283b" stroke-width="2" />
  <line x1="30" y1="90" x2="130" y2="90" stroke="#24283b" stroke-width="2" />
  <!-- Stars -->
  <circle cx="50" cy="50" r="1" fill="#7aa2f7" opacity="0.6" />
  <circle cx="105" cy="40" r="1" fill="#bb9af7" opacity="0.8" />
  <circle cx="70" cy="110" r="1" fill="#ffffff" opacity="0.4" />
  <circle cx="115" cy="125" r="1.5" fill="#e0af68" opacity="0.5" />

  <!-- Desk Surface -->
  <rect x="10" y="270" width="480" height="70" rx="4" fill="#24283b" />
  <rect x="10" y="270" width="480" height="8" fill="#1f2335" />

  <!-- Server Tower (DevOps representation) -->
  <rect x="30" y="170" width="60" height="100" rx="4" fill="#16161e" stroke="#24283b" stroke-width="2" />
  <line x1="30" y1="200" x2="90" y2="200" stroke="#24283b" stroke-width="1.5" />
  <line x1="30" y1="230" x2="90" y2="230" stroke="#24283b" stroke-width="1.5" />
  <!-- Server LED Lights -->
  <circle cx="45" cy="185" r="2" class="server-led" style="animation-delay: 0.1s;" />
  <circle cx="55" cy="185" r="2" class="server-led" style="animation-delay: 0.3s;" />
  <circle cx="75" cy="185" r="2" class="server-led" style="animation-delay: 0.6s;" />
  <circle cx="45" cy="215" r="2" class="server-led" style="animation-delay: 0.2s;" />
  <circle cx="55" cy="215" r="2" class="server-led" style="animation-delay: 0.5s;" />
  <circle cx="45" cy="245" r="2" class="server-led" style="animation-delay: 0.4s;" />
  <circle cx="55" cy="245" r="2" class="server-led" style="animation-delay: 0.8s;" />

  <!-- Desk Lamp -->
  <path d="M430,270 L430,120 L380,100" fill="none" stroke="#24283b" stroke-width="5" stroke-linecap="round" />
  <path d="M385,90 L365,110 L395,110 Z" fill="#ff9e64" stroke="#24283b" stroke-width="2" />
  <!-- Lamp Light Cone -->
  <polygon points="380,110 260,270 480,270" fill="url(#lamp-cone)" class="lamp-glow" />

  <!-- Code Monitor (Main Screen) -->
  <rect x="150" y="80" width="160" height="110" rx="6" fill="#1a1b26" stroke="#24283b" stroke-width="3" />
  <!-- Monitor Stand -->
  <path d="M220,190 L210,240 L250,240 L240,190 Z" fill="#24283b" />
  <rect x="200" y="240" width="60" height="6" rx="2" fill="#1f2335" />
  <!-- Screen Header -->
  <rect x="153" y="83" width="154" height="12" fill="#24283b" />
  <circle cx="160" cy="89" r="2" fill="#f7768e" />
  <circle cx="168" cy="89" r="2" fill="#e0af68" />
  <circle cx="176" cy="89" r="2" fill="#9ece6a" />
  <text x="230" y="92" text-anchor="middle" fill="#565f89" font-family="monospace" font-size="8">bash - code.go</text>
  <!-- Screen Glow -->
  <rect x="153" y="95" width="154" height="92" fill="url(#screen-glow)" />

  <!-- Scrolling Code Text lines -->
  <g clip-path="url(#monitor-clip)" transform="translate(160, 105)">
    <clipPath id="monitor-clip">
      <rect x="0" y="0" width="140" height="75" />
    </clipPath>
    <g class="code-lines">
      <path d="M0,10 L80,10 M0,20 L60,20 M10,30 L90,30 M10,40 L50,40 M0,50 L70,50 M0,60 L40,60 M10,70 L80,70 M10,80 L60,80 M0,90 L90,90 M0,100 L50,100" 
            stroke="#7aa2f7" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M40,20 L80,20 M60,30 L80,30 M20,50 L40,50 M30,60 L60,60 M40,80 L80,80 M20,100 L70,100" 
            stroke="#bb9af7" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M10,10 L30,10 M30,40 L45,40 M50,50 L65,50 M0,80 L20,80" 
            stroke="#9ece6a" stroke-width="2" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- Secondary Monitor (DevOps / Analytics Dashboard) -->
  <rect x="330" y="110" width="110" height="85" rx="4" fill="#1a1b26" stroke="#24283b" stroke-width="2.5" />
  <!-- Stand -->
  <path d="M375,195 L370,240 L400,240 L395,195 Z" fill="#24283b" />
  <!-- Screen Grid/Charts -->
  <g stroke="#24283b" stroke-width="1" fill="none">
    <line x1="340" y1="125" x2="430" y2="125" />
    <line x1="340" y1="140" x2="430" y2="140" />
    <line x1="340" y1="155" x2="430" y2="155" />
    <line x1="340" y1="170" x2="430" y2="170" />
    <line x1="362" y1="120" x2="362" y2="185" />
    <line x1="385" y1="120" x2="385" y2="185" />
    <line x1="407" y1="120" x2="407" y2="185" />
  </g>
  <!-- Chart Lines -->
  <path d="M340,170 L362,150 L385,160 L407,135 L430,145" fill="none" stroke="#22d3ee" stroke-width="2" class="chart-line" />
  <path d="M340,155 L362,165 L385,145 L407,150 L430,125" fill="none" stroke="#ff9e64" stroke-width="1.5" class="chart-line" style="animation-delay: 1.5s;" />

  <!-- Keyboard on Desk -->
  <rect x="180" y="252" width="100" height="12" rx="2" fill="#1f2335" stroke="#24283b" stroke-width="1.5" />
  <!-- Keys (groups of boxes that blink) -->
  <g class="key-caps" stroke="#16161e" stroke-width="0.5">
    <rect x="185" y="254" width="8" height="3" rx="0.5" fill="#24283b" style="animation-delay: 0.1s;" />
    <rect x="195" y="254" width="8" height="3" rx="0.5" fill="#24283b" style="animation-delay: 0.3s;" />
    <rect x="205" y="254" width="8" height="3" rx="0.5" fill="#24283b" style="animation-delay: 0.5s;" />
    <rect x="215" y="254" width="8" height="3" rx="0.5" fill="#24283b" style="animation-delay: 0.2s;" />
    <rect x="225" y="254" width="8" height="3" rx="0.5" fill="#24283b" style="animation-delay: 0.7s;" />
    <rect x="235" y="254" width="8" height="3" rx="0.5" fill="#24283b" style="animation-delay: 0.4s;" />
    <rect x="245" y="254" width="8" height="3" rx="0.5" fill="#24283b" style="animation-delay: 0.9s;" />
    <rect x="255" y="254" width="8" height="3" rx="0.5" fill="#24283b" style="animation-delay: 0.6s;" />
    <rect x="265" y="254" width="10" height="3" rx="0.5" fill="#24283b" style="animation-delay: 0.8s;" />

    <rect x="185" y="259" width="12" height="3" rx="0.5" fill="#24283b" style="animation-delay: 0.4s;" />
    <rect x="200" y="259" width="45" height="3" rx="0.5" fill="#24283b" style="animation-delay: 0.2s;" /> <!-- Spacebar -->
    <rect x="248" y="259" width="12" height="3" rx="0.5" fill="#24283b" style="animation-delay: 0.6s;" />
  </g>

  <!-- Mouse on mousepad -->
  <rect x="295" y="256" width="15" height="8" rx="3" fill="#1f2335" stroke="#24283b" stroke-width="1" />

  <!-- Coffee Mug -->
  <rect x="135" y="245" width="12" height="16" rx="2" fill="#ff9e64" />
  <path d="M135,248 C131,248 131,257 135,257" fill="none" stroke="#ff9e64" stroke-width="2" />
  <!-- Steam lines rising -->
  <path d="M138,240 Q136,236 138,232" class="steam-line" />
  <path d="M141,240 Q143,235 141,230" class="steam-line" style="animation-delay: 0.8s;" />

  <!-- Stack of Books / Notebooks -->
  <rect x="325" y="250" width="40" height="7" rx="1.5" fill="#9ece6a" stroke="#24283b" stroke-width="1" />
  <rect x="328" y="244" width="34" height="6" rx="1" fill="#7aa2f7" stroke="#24283b" stroke-width="1" />
  <rect x="330" y="239" width="30" height="5" rx="1" fill="#bb9af7" stroke="#24283b" stroke-width="1" />
</svg>