<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <style>
    @keyframes pulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 2px #ffc107); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 8px #ff9e64); }
      100% { transform: scale(1); filter: drop-shadow(0 0 2px #ffc107); }
    }
    @keyframes rotate-orbit-clockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes rotate-orbit-counter {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .star {
      transform-origin: 60px 60px;
      animation: pulse 3s ease-in-out infinite;
      fill: url(#gold-gradient);
    }
    .orbit-1 {
      transform-origin: 60px 60px;
      animation: rotate-orbit-clockwise 8s linear infinite;
      stroke: #7aa2f7;
      stroke-dasharray: 6 12;
      stroke-width: 1.5;
    }
    .orbit-2 {
      transform-origin: 60px 60px;
      animation: rotate-orbit-counter 12s linear infinite;
      stroke: #bb9af7;
      stroke-dasharray: 4 8;
      stroke-width: 1;
    }
    .sparkle-1 { animation: sparkle 2s ease-in-out infinite; transform-origin: 25px 25px; }
    .sparkle-2 { animation: sparkle 2.5s ease-in-out infinite 0.5s; transform-origin: 95px 35px; }
    .sparkle-3 { animation: sparkle 3s ease-in-out infinite 1s; transform-origin: 35px 95px; }
    .sparkle-4 { animation: sparkle 1.8s ease-in-out infinite 1.5s; transform-origin: 85px 85px; }
  </style>

  <defs>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="50%" stop-color="#ffc107" />
      <stop offset="100%" stop-color="#ff9e64" />
    </linearGradient>
  </defs>

  <!-- Background Glow -->
  <circle cx="60" cy="60" r="45" fill="none" stroke="rgba(255, 193, 7, 0.05)" stroke-width="8" />

  <!-- Orbiting Lines -->
  <circle cx="60" cy="60" r="42" fill="none" class="orbit-1" />
  <circle cx="60" cy="60" r="32" fill="none" class="orbit-2" />

  <!-- Sparkles -->
  <polygon points="25,21 27,25 31,25 28,28 29,32 25,30 21,32 22,28 19,25 23,25" fill="#e0af68" class="sparkle-1" />
  <polygon points="95,31 97,35 101,35 98,38 99,42 95,40 91,42 92,38 89,35 93,35" fill="#bb9af7" class="sparkle-2" />
  <polygon points="35,91 37,95 41,95 38,98 39,102 35,100 31,102 32,98 29,95 33,95" fill="#7aa2f7" class="sparkle-3" />
  <polygon points="85,81 87,85 91,85 88,88 89,92 85,90 81,92 82,88 79,85 83,85" fill="#e0af68" class="sparkle-4" />

  <!-- Center Star -->
  <path class="star" d="M60 20 L72 45 L99 49 L79 68 L84 95 L60 82 L36 95 L41 68 L21 49 L48 45 Z" />

  <!-- Small details inside the star for dimension -->
  <path d="M60 20 L60 82 L36 95 L41 68 L21 49 L48 45 Z" fill="rgba(0,0,0,0.15)" transform-origin="60px 60px" style="animation: pulse 3s ease-in-out infinite;" />
</svg>
