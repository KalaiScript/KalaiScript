<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">
  <circle cx="15" cy="15" r="4" fill="#38BDF8" />
  <circle cx="15" cy="15" r="8" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="4;12" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="15" cy="15" r="12" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0">
    <animate attributeName="r" values="4;15" dur="2s" begin="0.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0" dur="2s" begin="0.5s" repeatCount="indefinite" />
  </circle>
</svg>
