<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <style>
    @keyframes grid-move {
      0% { transform: translateY(0); }
      100% { transform: translateY(20px); }
    }
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }
    @keyframes blink {
      0%, 100% { border-color: transparent; }
      50% { border-color: #22d3ee; }
    }
    @keyframes float-particle {
      0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
      50% { transform: translateY(-10px) rotate(15deg); opacity: 0.8; }
    }
    @keyframes text-glow {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(122, 162, 247, 0.4)); }
      50% { filter: drop-shadow(0 0 15px rgba(122, 162, 247, 0.9)); }
    }
    .grid-lines {
      transform-origin: center top;
      animation: grid-move 1.5s linear infinite;
    }
    .typing-text {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-weight: 500;
      fill: #22d3ee;
      overflow: hidden;
      white-space: nowrap;
    }
    .title-text {
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 900;
      fill: #ffffff;
      animation: text-glow 4s ease-in-out infinite;
    }
    .particle {
      animation: float-particle 4s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#1a1b26" />

  <!-- Clip path for grid so it stays at the bottom half -->
  <clipPath id="grid-clip">
    <rect x="0" y="80" width="800" height="120" />
  </clipPath>

  <!-- Grid Perspective Lines -->
  <g clip-path="url(#grid-clip)">
    <!-- Converging Perspective Lines -->
    <line x1="400" y1="80" x2="-200" y2="200" stroke="rgba(187, 154, 247, 0.15)" stroke-width="1.5" />
    <line x1="400" y1="80" x2="0" y2="200" stroke="rgba(187, 154, 247, 0.15)" stroke-width="1.5" />
    <line x1="400" y1="80" x2="200" y2="200" stroke="rgba(187, 154, 247, 0.15)" stroke-width="1.5" />
    <line x1="400" y1="80" x2="400" y2="200" stroke="rgba(187, 154, 247, 0.15)" stroke-width="2" />
    <line x1="400" y1="80" x2="600" y2="200" stroke="rgba(187, 154, 247, 0.15)" stroke-width="1.5" />
    <line x1="400" y1="80" x2="800" y2="200" stroke="rgba(187, 154, 247, 0.15)" stroke-width="1.5" />
    <line x1="400" y1="80" x2="1000" y2="200" stroke="rgba(187, 154, 247, 0.15)" stroke-width="1.5" />

    <!-- Animated Horizontal Lines -->
    <g class="grid-lines" stroke="rgba(122, 162, 247, 0.15)" stroke-width="1">
      <line x1="0" y1="80" x2="800" y2="80" />
      <line x1="0" y1="100" x2="800" y2="100" />
      <line x1="0" y1="120" x2="800" y2="120" />
      <line x1="0" y1="140" x2="800" y2="140" />
      <line x1="0" y1="160" x2="800" y2="160" />
      <line x1="0" y1="180" x2="800" y2="180" />
      <line x1="0" y1="200" x2="800" y2="200" />
    </g>
  </g>

  <!-- Overlay Horizon Glow -->
  <rect x="0" y="80" width="800" height="20" fill="url(#horizon-grad)" />

  <!-- Gradients -->
  <defs>
    <linearGradient id="horizon-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b26" stop-opacity="1" />
      <stop offset="100%" stop-color="#1a1b26" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="100%" stop-color="#bb9af7" />
    </linearGradient>
  </defs>

  <!-- Floating Tech Symbols / Particles -->
  <g class="particle" style="animation-delay: 0s; transform-origin: 100px 50px;">
    <text x="100" y="60" fill="#9ece6a" font-family="monospace" font-size="12" opacity="0.3">&lt;/&gt;</text>
  </g>
  <g class="particle" style="animation-delay: 1.5s; transform-origin: 700px 70px;">
    <text x="700" y="80" fill="#ff9e64" font-family="monospace" font-size="14" opacity="0.4">{}</text>
  </g>
  <g class="particle" style="animation-delay: 0.8s; transform-origin: 180px 140px;">
    <circle cx="180" cy="140" r="3" fill="#22d3ee" opacity="0.5" />
  </g>
  <g class="particle" style="animation-delay: 2.2s; transform-origin: 640px 130px;">
    <circle cx="640" cy="130" r="2.5" fill="#bb9af7" opacity="0.4" />
  </g>

  <!-- Profile Title -->
  <text x="50%" y="85" text-anchor="middle" font-size="42" class="title-text" fill="url(#title-grad)">Kalaiyarasan P</text>

  <!-- Subtitle Typing Line -->
  <g transform="translate(0, 115)">
    <!-- Base text rendering, simulated typewriter cursor -->
    <text x="50%" y="15" text-anchor="middle" font-size="14" class="typing-text">Full Stack Developer | DevOps &amp; Cloud Architect</text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="0" y1="199" x2="800" y2="199" stroke="url(#title-grad)" stroke-width="2" />
</svg>
