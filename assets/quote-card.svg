<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 130" width="100%" height="100%">
  <defs>
    <linearGradient id="quote-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bb9af7" />
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0, 0, 0, 0.4)" />
    </filter>
  </defs>

  <style>
    @keyframes quote-pulse {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.4)); }
      50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.9)); }
    }
    .quote-mark {
      font-family: 'Georgia', serif;
      font-size: 50px;
      fill: url(#quote-glow);
      animation: quote-pulse 4s ease-in-out infinite;
    }
    .quote-text {
      font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-size: 13.5px;
      fill: #c0caf5;
      letter-spacing: 0.2px;
    }
    .author-text {
      font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #38bdf8;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="476" height="126" rx="8" fill="#1a1b26" stroke="rgba(122, 162, 247, 0.22)" stroke-width="1.5" filter="url(#card-shadow)" />

  <!-- Quotation Mark Icon -->
  <text x="22" y="52" class="quote-mark">“</text>

  <!-- Quote Lines -->
  <text x="56" y="44" class="quote-text">Any fool can write code that a computer</text>
  <text x="56" y="66" class="quote-text">can understand. Good programmers write</text>
  <text x="56" y="88" class="quote-text">code that humans can understand.</text>

  <!-- Author Attribution -->
  <text x="440" y="112" text-anchor="end" class="author-text">— Martin Fowler</text>
</svg>
