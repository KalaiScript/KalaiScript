<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-12deg); }
      40% { transform: rotate(10deg); }
      60% { transform: rotate(-10deg); }
      80% { transform: rotate(8deg); }
    }
    @keyframes ripple {
      0% { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .hand {
      transform-origin: 50px 75px;
      animation: wave 2.2s ease-in-out infinite;
    }
    .ripple-ring {
      transform-origin: 50px 50px;
      animation: ripple 2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
      stroke: #7aa2f7;
      stroke-width: 1.5;
    }
    .ripple-ring-2 {
      animation-delay: 1s;
      stroke: #bb9af7;
    }
  </style>

  <!-- Radiating Rings -->
  <circle cx="50" cy="50" r="22" fill="none" class="ripple-ring" />
  <circle cx="50" cy="50" r="22" fill="none" class="ripple-ring ripple-ring-2" />

  <!-- Waving Hand SVG -->
  <g class="hand">
    <!-- Hand base/wrist -->
    <path d="M42,75 L58,75 L56,90 L44,90 Z" fill="#24283b" stroke="#7aa2f7" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Sleeve -->
    <rect x="40" y="82" width="20" height="10" rx="2" fill="#7aa2f7" />

    <!-- Palm and Fingers -->
    <!-- We'll draw a welcoming yellow/orange hand -->
    <path d="M42,75 
             C35,70 34,60 38,55 
             C40,52 44,55 45,58 
             L45,40 
             C45,36 49,36 49,40 
             L49,34 
             C49,30 53,30 53,34 
             L53,36 
             C53,32 57,32 57,36 
             L57,42 
             C57,38 61,38 61,42 
             L61,60 
             C61,68 58,75 42,75 Z" 
          fill="#ff9e64" 
          stroke="#16161e" 
          stroke-width="1.5" 
          stroke-linejoin="round" />
          
    <!-- Thumb details -->
    <path d="M38,62 C34,60 32,65 37,68 Z" fill="#e0af68" />
  </g>
</svg>
