<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="120">
  <style>
    .quote-box {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { stroke: #7aa2f7; stroke-width: 1px; }
      100% { stroke: #bb9af7; stroke-width: 1px; }
    }
  </style>

  <!-- Card Background -->
  <rect width="598" height="118" x="1" y="1" rx="8" fill="#1a1b26" class="quote-box" />
  
  <!-- Left Side Decorative Icon -->
  <g transform="translate(25, 42)">
    <path d="M0 0h6v6H0zm10 0h6v6h-6zm10 0h6v6h-6zM0 10h6v6H0zm10 0h6v6h-6zm10 0h6v6h-6z" fill="#7aa2f7" opacity="0.6"/>
  </g>
  
  <!-- Text content -->
  <g transform="translate(65, 0)">
    <text x="0" y="45" fill="#a9b1d6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-style="italic">“Software is a great combination between artistry and”</text><text x="0" y="68" fill="#a9b1d6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-style="italic">engineering.”</text>
    <text x="0" y="95" fill="#ff9e64" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">
      — Bill Gates
    </text>
  </g>
</svg>
