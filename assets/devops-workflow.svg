<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="100%" height="100%">
  <style>
    @keyframes gear-rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes gear-rotate-reverse {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes package-move {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes beacon-pulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.4); opacity: 0.9; filter: drop-shadow(0 0 3px #9ece6a); }
    }
    @keyframes pulse-stroke {
      0%, 100% { stroke: #24283b; }
      50% { stroke: #7aa2f7; }
    }

    .gear-clockwise {
      transform-origin: 215px 75px;
      animation: gear-rotate 4s linear infinite;
    }
    .gear-counter {
      transform-origin: 231px 63px;
      animation: gear-rotate-reverse 3s linear infinite;
    }
    .pulse-path {
      stroke-dasharray: 8 8;
      animation: pulse-stroke 2s infinite;
    }
    .package-dot {
      fill: #22d3ee;
      filter: drop-shadow(0 0 4px #22d3ee);
      /* Use SVG Motion Path */
      motion-path: path("M95,75 L165,75 M255,75 L325,75 M415,75 L485,75");
      offset-path: path("M95,75 L165,75 M255,75 L325,75 M415,75 L485,75");
      animation: package-move 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .k8s-node {
      transform-origin: center;
      animation: beacon-pulse 2s infinite;
    }
  </style>

  <!-- Background Card -->
  <rect width="100%" height="100%" fill="#1a1b26" rx="8" stroke="rgba(122, 162, 247, 0.15)" stroke-width="1.5" />

  <!-- Pipeline Connector Paths (Behind nodes) -->
  <path d="M95,75 L165,75" stroke="#24283b" stroke-width="3" fill="none" class="pulse-path" />
  <path d="M255,75 L325,75" stroke="#24283b" stroke-width="3" fill="none" class="pulse-path" style="animation-delay: 1.5s;" />
  <path d="M415,75 L485,75" stroke="#24283b" stroke-width="3" fill="none" class="pulse-path" style="animation-delay: 3s;" />

  <!-- Conveyor Belt Animation Item -->
  <circle r="4" class="package-dot" />

  <!-- 1. Node Commit -->
  <g transform="translate(15, 35)">
    <rect width="80" height="80" rx="6" fill="#16161e" stroke="#7aa2f7" stroke-width="1.5" />
    <text x="40" y="25" fill="#a9b1d6" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">GIT</text>
    <!-- Branch symbol visual -->
    <path d="M35,38 L35,62 M35,50 L45,40 M35,62 C35,63.5 36.5,65 38,65 L45,65" stroke="#7aa2f7" stroke-width="2" fill="none" stroke-linecap="round" />
    <circle cx="35" cy="38" r="3" fill="#1a1b26" stroke="#7aa2f7" stroke-width="2" />
    <circle cx="45" cy="40" r="3" fill="#1a1b26" stroke="#7aa2f7" stroke-width="2" />
    <circle cx="45" cy="65" r="3" fill="#1a1b26" stroke="#7aa2f7" stroke-width="2" />
    <text x="40" y="72" fill="#7aa2f7" font-family="monospace" font-size="8" text-anchor="middle">commit</text>
  </g>

  <!-- 2. Node CI Build -->
  <g transform="translate(165, 35)">
    <rect width="90" height="80" rx="6" fill="#16161e" stroke="#bb9af7" stroke-width="1.5" />
    <text x="45" y="25" fill="#a9b1d6" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">CI ACTION</text>
    <!-- Rotating gears -->
    <g class="gear-clockwise">
      <path d="M215,67 L215,83 M207,75 L223,75 M209,69 L221,81 M209,81 L221,69" stroke="#bb9af7" stroke-width="2" />
      <circle cx="215" cy="75" r="5" fill="#16161e" stroke="#bb9af7" stroke-width="2" />
    </g>
    <g class="gear-counter">
      <path d="M231,58 L231,68 M226,63 L236,63" stroke="#ff9e64" stroke-width="1.5" />
      <circle cx="231" cy="63" r="3" fill="#16161e" stroke="#ff9e64" stroke-width="1.5" />
    </g>
    <text x="45" y="72" fill="#bb9af7" font-family="monospace" font-size="8" text-anchor="middle">testing</text>
  </g>

  <!-- 3. Node Container Registry -->
  <g transform="translate(325, 35)">
    <rect width="90" height="80" rx="6" fill="#16161e" stroke="#ff9e64" stroke-width="1.5" />
    <text x="45" y="25" fill="#a9b1d6" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">REGISTRY</text>
    <!-- Cube visual -->
    <path d="M370,42 L350,52 L350,72 L370,82 L390,72 L390,52 Z M350,52 L370,62 L390,52 M370,62 L370,82" stroke="#ff9e64" stroke-width="1.5" fill="none" stroke-linejoin="round" />
    <text x="45" y="72" fill="#ff9e64" font-family="monospace" font-size="8" text-anchor="middle">package</text>
  </g>

  <!-- 4. Node Deploy K8s -->
  <g transform="translate(485, 35)">
    <rect width="100" height="80" rx="6" fill="#16161e" stroke="#9ece6a" stroke-width="1.5" />
    <text x="50" y="25" fill="#a9b1d6" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">KUBERNETES</text>
    <!-- Cluster node map -->
    <circle cx="535" cy="45" r="4" fill="#9ece6a" class="k8s-node" />
    <circle cx="515" cy="60" r="4" fill="#9ece6a" class="k8s-node" style="animation-delay: 0.5s; transform-origin: 515px 60px;" />
    <circle cx="555" cy="60" r="4" fill="#9ece6a" class="k8s-node" style="animation-delay: 1s; transform-origin: 555px 60px;" />
    <line x1="535" y1="45" x2="515" y2="60" stroke="rgba(158, 206, 106, 0.4)" stroke-width="1" />
    <line x1="535" y1="45" x2="555" y2="60" stroke="rgba(158, 206, 106, 0.4)" stroke-width="1" />
    <line x1="515" y1="60" x2="555" y2="60" stroke="rgba(158, 206, 106, 0.4)" stroke-width="1" />
    <text x="50" y="72" fill="#9ece6a" font-family="monospace" font-size="8" text-anchor="middle">deploy</text>
  </g>
</svg>
