<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="100%" height="100%">
  <style>
    @keyframes key-glow {
      0%, 100% { fill: #24283b; filter: none; }
      50% { fill: #7aa2f7; filter: drop-shadow(0 0 4px #7aa2f7); }
    }
    @keyframes key-glow-alt {
      0%, 100% { fill: #24283b; filter: none; }
      50% { fill: #bb9af7; filter: drop-shadow(0 0 4px #bb9af7); }
    }
    @keyframes text-scroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(-40px); }
    }
    @keyframes pulse-code {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.5; }
      50% { transform: scale(1.1) rotate(3deg); opacity: 1; }
    }
    .key-1 { animation: key-glow 1.2s infinite; }
    .key-2 { animation: key-glow-alt 1.5s infinite 0.3s; }
    .key-3 { animation: key-glow 1.8s infinite 0.6s; }
    .key-4 { animation: key-glow-alt 1.1s infinite 0.9s; }
    
    .terminal-lines {
      animation: text-scroll 8s linear infinite;
    }
    .code-badge-1 {
      transform-origin: 25px 35px;
      animation: pulse-code 4s ease-in-out infinite;
    }
    .code-badge-2 {
      transform-origin: 125px 35px;
      animation: pulse-code 5s ease-in-out infinite 1s;
    }
  </style>

  <!-- Background base -->
  <rect width="100%" height="100%" fill="#16161e" rx="10" stroke="rgba(187, 154, 247, 0.15)" stroke-width="2" />

  <!-- Code Screen Display Mock -->
  <rect x="25" y="15" width="100%" height="60" rx="4" fill="#1a1b26" stroke="#24283b" stroke-width="1.5" transform="translate(-12.5, 0)" />
  <rect x="15" y="15" width="95" height="45" fill="#1a1b26" clip-path="url(#screen-clip)" />
  
  <clipPath id="screen-clip">
    <rect x="15" y="18" width="95" height="40" />
  </clipPath>
  
  <!-- Scrolling Terminal Text inside Clip Path -->
  <g clip-path="url(#screen-clip)">
    <g class="terminal-lines">
      <text x="18" y="28" fill="#9ece6a" font-family="monospace" font-size="6">package main</text>
      <text x="18" y="36" fill="#7aa2f7" font-family="monospace" font-size="6">import "fmt"</text>
      <text x="18" y="44" fill="#bb9af7" font-family="monospace" font-size="6">func main() {</text>
      <text x="24" y="52" fill="#ff9e64" font-family="monospace" font-size="6">  c := make(chan int)</text>
      <text x="24" y="60" fill="#9ece6a" font-family="monospace" font-size="6">  go solve(c)</text>
      <text x="24" y="68" fill="#e0af68" font-family="monospace" font-size="6">  fmt.Println(&lt;-c)</text>
      <text x="18" y="76" fill="#bb9af7" font-family="monospace" font-size="6">}</text>
      <!-- Repeat for seamless scroll loop -->
      <text x="18" y="86" fill="#9ece6a" font-family="monospace" font-size="6">package main</text>
      <text x="18" y="94" fill="#7aa2f7" font-family="monospace" font-size="6">import "fmt"</text>
    </g>
  </g>

  <!-- Floating Tags / Badges -->
  <g class="code-badge-1" transform="translate(110, 5)">
    <rect x="0" y="0" width="22" height="10" rx="3" fill="#24283b" stroke="#7aa2f7" stroke-width="0.5" />
    <text x="4" y="7" fill="#7aa2f7" font-family="sans-serif" font-size="5" font-weight="bold">&lt;/&gt;</text>
  </g>
  <g class="code-badge-2" transform="translate(5, 5)">
    <rect x="0" y="0" width="20" height="10" rx="3" fill="#24283b" stroke="#bb9af7" stroke-width="0.5" />
    <text x="4" y="7" fill="#bb9af7" font-family="sans-serif" font-size="5" font-weight="bold">{}</text>
  </g>

  <!-- Keyboard Base -->
  <rect x="15" y="85" width="120" height="48" rx="6" fill="#1f2335" stroke="#24283b" stroke-width="2" />
  
  <!-- Keys Row 1 -->
  <rect x="20" y="90" width="10" height="8" rx="1.5" fill="#24283b" class="key-1" />
  <rect x="33" y="90" width="10" height="8" rx="1.5" fill="#24283b" class="key-2" />
  <rect x="46" y="90" width="10" height="8" rx="1.5" fill="#24283b" class="key-3" />
  <rect x="59" y="90" width="10" height="8" rx="1.5" fill="#24283b" class="key-4" />
  <rect x="72" y="90" width="10" height="8" rx="1.5" fill="#24283b" class="key-1" style="animation-delay: 0.4s;" />
  <rect x="85" y="90" width="10" height="8" rx="1.5" fill="#24283b" class="key-2" style="animation-delay: 0.5s;" />
  <rect x="98" y="90" width="10" height="8" rx="1.5" fill="#24283b" class="key-3" style="animation-delay: 0.2s;" />
  <rect x="111" y="90" width="18" height="8" rx="1.5" fill="#24283b" />

  <!-- Keys Row 2 -->
  <rect x="20" y="101" width="12" height="8" rx="1.5" fill="#24283b" />
  <rect x="35" y="101" width="10" height="8" rx="1.5" fill="#24283b" class="key-4" style="animation-delay: 0.1s;" />
  <rect x="48" y="101" width="10" height="8" rx="1.5" fill="#24283b" class="key-1" style="animation-delay: 0.7s;" />
  <rect x="61" y="101" width="10" height="8" rx="1.5" fill="#24283b" class="key-2" style="animation-delay: 0.8s;" />
  <rect x="74" y="101" width="10" height="8" rx="1.5" fill="#24283b" class="key-3" style="animation-delay: 0.5s;" />
  <rect x="87" y="101" width="10" height="8" rx="1.5" fill="#24283b" class="key-4" style="animation-delay: 0.6s;" />
  <rect x="100" y="101" width="10" height="8" rx="1.5" fill="#24283b" class="key-1" style="animation-delay: 0.2s;" />
  <rect x="113" y="101" width="16" height="8" rx="1.5" fill="#24283b" />

  <!-- Keys Row 3 (Spacebar row) -->
  <rect x="20" y="112" width="16" height="8" rx="1.5" fill="#24283b" />
  <rect x="39" y="112" width="10" height="8" rx="1.5" fill="#24283b" class="key-2" style="animation-delay: 0.1s;" />
  <rect x="52" y="112" width="46" height="8" rx="1.5" fill="#24283b" class="key-3" style="animation-delay: 0.4s;" /> <!-- Spacebar -->
  <rect x="101" y="112" width="10" height="8" rx="1.5" fill="#24283b" class="key-4" style="animation-delay: 0.2s;" />
  <rect x="114" y="112" width="15" height="8" rx="1.5" fill="#24283b" />

  <!-- Hands/Typing indication (Small speed lines above keys) -->
  <line x1="43" y1="87" x2="43" y2="84" stroke="#ff9e64" stroke-width="1.5" stroke-linecap="round" class="key-1" />
  <line x1="65" y1="87" x2="65" y2="83" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" class="key-2" />
  <line x1="82" y1="87" x2="82" y2="85" stroke="#9ece6a" stroke-width="1.5" stroke-linecap="round" class="key-3" />
</svg>
